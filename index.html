<!DOCTYPE html>
<html>
<head>
    <title>Lemonade Heaven 🍋</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

<!-- START SCREEN -->

<div id="startScreen">

<h1>🍋 Lemonade Heaven</h1>

<p>
Build a lemonade stand.
<br>
Create a lemonade empire.
</p>

<button onclick="newGame()">
NEW GAME
</button>

<button onclick="continueGame()">
CONTINUE
</button>

</div>



<!-- GAME SCREEN -->

<div id="gameScreen" style="display:none;">

<h1>🍋 Lemonade Heaven</h1>


<div class="money">
💰 $<span id="money">0</span>
</div>


<button class="sell" onclick="sellLemonade()">
🍋 Sell Lemonade
</button>



<div class="stats">

<p>
Per Click:
$<span id="clickPower">1</span>
</p>

<p>
Per Second:
$<span id="income">0</span>
</p>

</div>



<h2>🏪 Upgrades</h2>


<div class="upgrades">


<button onclick="buy('recipe')">
🍋 Better Recipe
<br>
+$1/click
<br>
$<span id="recipe">10</span>
</button>


<button onclick="buy('employee')">
👥 Employees
<br>
+$0.1/sec
<br>
$<span id="employee">50</span>
</button>


<button onclick="buy('shop')">
🏪 Shops
<br>
+10% profit
<br>
$<span id="shop">250</span>
</button>


<button onclick="buy('factory')">
🏭 Factory
<br>
+$10/sec
<br>
$<span id="factory">1000</span>
</button>


<button onclick="buy('delivery')">
🚚 Delivery
<br>
+$5/sec
<br>
$<span id="delivery">5000</span>
</button>


<button onclick="buy('advertising')">
📢 Advertising
<br>
+25% profit
<br>
$<span id="advertising">15000</span>
</button>


<button onclick="buy('farm')">
🍋 Lemon Farm
<br>
+$50/sec
<br>
$<span id="farm">50000</span>
</button>


<button onclick="buy('ai')">
🤖 AI Machines
<br>
+$250/sec
<br>
$<span id="ai">250000</span>
</button>


<button onclick="buy('global')">
🌎 Global Expansion
<br>
x2 profit
<br>
$<span id="global">1000000</span>
</button>


</div>


<p id="message">
Welcome!
</p>


<button onclick="resetGame()">
Reset Game
</button>


</div>

</div>


<script src="script.js"></script>

</body>
</html>
