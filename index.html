<!DOCTYPE html>
<html>
<head>
    <title>Lemonade Heaven 🍋</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>🍋 Lemonade Heaven</h1>
        <p class="subtitle">Build the biggest lemonade empire!</p>

        <div class="money">
            💰 $<span id="money">0</span>
        </div>

        <div class="lemon">
            🍋
        </div>

        <button onclick="sellLemonade()">
            Sell Lemonade
        </button>

        <div class="shop">

            <h2>🏪 Shop</h2>

            <button onclick="buyUpgrade()">
                Better Recipe
                <br>
                Cost: $<span id="upgradeCost">10</span>
            </button>

            <p>
                Lemonade Power:
                <span id="power">1</span>
            </p>

        </div>

        <p id="message">
            Welcome to Lemonade Heaven!
        </p>

    </div>


<script src="script.js"></script>

</body>
</html>
