<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lemonade Heaven 🍋</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Background -->

<div class="sky">

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>

</div>


<!-- ========================= -->
<!-- START MENU -->
<!-- ========================= -->

<div id="menu" class="screen">

    <h1>Lemonade Heaven 🍋</h1>

    <p class="tagline">
        Build a tiny lemonade stand...
        <br>
        into a worldwide empire.
    </p>

    <button id="newGameButton">
        🍋 New Game
    </button>

    <button id="continueButton">
        ▶ Continue
    </button>

    <p class="version">
        Version 0.1
    </p>

</div>



<!-- ========================= -->
<!-- GAME -->
<!-- ========================= -->

<div id="game" class="hidden">

<header>

<div class="moneyCard">

<h2>$<span id="money">0</span></h2>

<p>Money</p>

</div>


<div class="stats">

<div>

<strong>Per Click</strong>

<p>$<span id="clickIncome">1</span></p>

</div>


<div>

<strong>Per Second</strong>

<p>$<span id="passiveIncome">0</span></p>

</div>

</div>

</header>



<main>

<div class="left">

<h2>Your Stand</h2>

<div id="lemonButton">

🍋

</div>

<p class="hint">
Click the lemon to sell lemonade!
</p>

</div>



<div class="right">

<h2>Upgrades</h2>

<div id="upgradeList">

<button class="upgrade" data-upgrade="recipe">

<div>

🍋 Better Recipe

</div>

<span id="recipeCost">$10</span>

</button>



<button class="upgrade" data-upgrade="employee">

<div>

👥 Employees

</div>

<span id="employeeCost">$50</span>

</button>



<button class="upgrade" data-upgrade="shop">

<div>

🏪 Shops

</div>

<span id="shopCost">$250</span>

</button>



<button class="upgrade" data-upgrade="factory">

<div>

🏭 Factory

</div>

<span id="factoryCost">$1000</span>

</button>



<button class="upgrade" data-upgrade="delivery">

<div>

🚚 Delivery Service

</div>

<span id="deliveryCost">$5000</span>

</button>



<button class="upgrade" data-upgrade="advertising">

<div>

📢 Advertising

</div>

<span id="advertisingCost">$15000</span>

</button>



<button class="upgrade" data-upgrade="farm">

<div>

🍋 Lemon Farm

</div>

<span id="farmCost">$50000</span>

</button>



<button class="upgrade" data-upgrade="ai">

<div>

🤖 AI Machines

</div>

<span id="aiCost">$250000</span>

</button>



<button class="upgrade" data-upgrade="global">

<div>

🌎 Global Expansion

</div>

<span id="globalCost">$1000000</span>

</button>

</div>

</div>

</main>


<footer>

<div id="status">

Welcome to Lemonade Heaven!

</div>

</footer>

</div>


<script src="script.js"></script>

</body>

</html>
