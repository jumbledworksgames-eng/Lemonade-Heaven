<!DOCTYPE html>
<html>
<head>
    <title>Lemonade Heaven 🍋</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>🍋 Lemonade Heaven</h1>
        <p class="subtitle">Build the ultimate lemonade empire!</p>

        <div class="money-box">
            💰 Money: $<span id="money">0</span>
        </div>

        <div class="stand">
            🍋
        </div>

        <button onclick="sellLemonade()" class="main-button">
            Sell Lemonade
        </button>

        <div class="stats">
            <p>
                Lemonade per sale:
                <b><span id="power">1</span></b>
            </p>
        </div>

        <div class="shop">
            <h2>🏪 Shop</h2>

            <button onclick="buyUpgrade()">
                Better Recipe
                <br>
                $<span id="upgradeCost">10</span>
            </button>

            <p id="message">
                Start selling lemonade!
            </p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
