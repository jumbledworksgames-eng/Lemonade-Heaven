<!DOCTYPE html>
<html>

<head>
    <title>Lemonade Heaven 🍋</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🍋 Lemonade Heaven</h1>
    <p class="subtitle">Turn a lemonade stand into an empire.</p>


    <div class="money">
        💰 $<span id="money">0</span>
    </div>


    <button class="sell" onclick="sell()">
        🍋 Sell Lemonade
    </button>


    <div class="stats">

        <div>
            Click:
            $<span id="click">1</span>
        </div>

        <div>
            Per Second:
            $<span id="second">0</span>
        </div>

    </div>



    <h2>🏪 Upgrades</h2>


    <div class="upgrades">


        <button onclick="buy('recipe')">
            🍋 Better Recipe
            <br>
            <small>+1 per click</small>
            <br>
            $<span id="recipe-price">10</span>
        </button>


        <button onclick="buy('employee')">
            👥 Employees
            <br>
            <small>+$0.1/sec</small>
            <br>
            $<span id="employee-price">50</span>
        </button>


        <button onclick="buy('shop')">
            🏪 Shops
            <br>
            <small>+10% profit</small>
            <br>
            $<span id="shop-price">250</span>
        </button>


        <button onclick="buy('factory')">
            🏭 Factory
            <br>
            <small>+$10/sec</small>
            <br>
            $<span id="factory-price">1000</span>
        </button>


        <button onclick="buy('delivery')">
            🚚 Delivery
            <br>
            <small>+$5/sec</small>
            <br>
            $<span id="delivery-price">5000</span>
        </button>


        <button onclick="buy('ads')">
            📢 Advertising
            <br>
            <small>+25% profit</small>
            <br>
            $<span id="ads-price">15000</span>
        </button>


        <button onclick="buy('farm')">
            🍋 Lemon Farm
            <br>
            <small>+$50/sec</small>
            <br>
            $<span id="farm-price">50000</span>
        </button>


        <button onclick="buy('ai')">
            🤖 AI Machines
            <br>
            <small>+$250/sec</small>
            <br>
            $<span id="ai-price">250000</span>
        </button>


        <button onclick="buy('global')">
            🌎 Global Expansion
            <br>
            <small>x2 profit</small>
            <br>
            $<span id="global-price">1000000</span>
        </button>


    </div>


    <p id="message">
        Welcome to your lemonade empire!
    </p>


</div>


<script src="script.js"></script>

</body>

</html>
